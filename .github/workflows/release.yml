name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag and repo (lowercase)
        id: meta
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.REPO }}/histoire-france-api:${{ steps.meta.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.REPO }}/histoire-france-api:latest

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.REPO }}/histoire-france-web:${{ steps.meta.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.REPO }}/histoire-france-web:latest

  deploy:
    name: Deploy on server
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          VERSION: ${{ github.ref_name }}
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ~/histoire-france

          # Mettre à jour le compose file
          cp $GITHUB_WORKSPACE/docker-compose.prod.yml .

          # Connexion au registry GitHub
          echo "$CR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull des nouvelles images
          VERSION=$VERSION docker compose -f docker-compose.prod.yml --env-file .env.prod pull

          # Redémarrage sans downtime
          VERSION=$VERSION docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

          # Migration Prisma
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api \
            npx prisma migrate deploy

          # Nettoyage des vieilles images
          docker image prune -f
