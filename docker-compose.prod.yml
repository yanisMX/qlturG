services:
  postgres:
    image: postgres:16-alpine
    container_name: hf_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: histoire_france
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/yanismx/qlturG/histoire-france-api:${VERSION:-latest}
    container_name: hf_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
      ADMIN_KEY: ${ADMIN_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/yanismx/qlturG/histoire-france-web:${VERSION:-latest}
    container_name: hf_web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  postgres_data:
