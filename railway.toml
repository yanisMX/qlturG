[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "(node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma || node_modules/.bin/prisma db push --skip-generate --schema apps/api/prisma/schema.prisma) && node apps/api/dist/main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
