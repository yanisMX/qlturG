services:
  postgres:
    image: postgres:16-alpine
    container_name: histoire_france_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: histoire_france
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: histoire_france_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/histoire_france
      PORT: 3001
      ADMIN_KEY: change-me-in-production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: histoire_france_web
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: http://localhost:3001
    ports:
      - '5173:80'
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
